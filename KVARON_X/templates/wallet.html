<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRXWallet — KRX</title>
  <style>
    :root{
      --bg:#080808;--bg2:#0f0f0f;--card:#111;--card2:#161616;
      --border:#1e1e1e;--border2:#2a2a2a;
      --text:#f0f0f0;--text2:#aaa;--text3:#666;--text4:#3a3a3a;
      --red:#e0245e;--green:#1D9E75;
      --accent:#7F77DD;--accent2:#5B52CC;
      --gold:#EF9F27;--neon:#00D4FF;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;display:flex;min-height:100vh}

    /* ── SIDEBAR ── */
    
    .logo{font-size:22px;font-weight:900;padding:6px 12px 16px;letter-spacing:-1px}
    .logo span{color:#333}
    .nav-section-label{font-size:10px;color:#222;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:8px 12px 4px}
    
    .nav-item:hover{background:#141414;color:#bbb}
    .nav-item.active{color:#fff;background:#1a1a1a}
    .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 4px 4px 0}
    .nav-item.wallet-nav{color:var(--accent)}
    .nav-item.wallet-nav:hover{background:#0d0d1f;color:#a09fff}
    
    .icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
    .wallet-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;margin-left:auto;box-shadow:0 0 8px var(--accent);animation:dotPulse 2s infinite}
    @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
    .nav-div{height:1px;background:#161616;margin:6px 10px}
    .nav-spacer{flex:1}
    .sidebar-user{display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid #161616;margin-top:6px;text-decoration:none;border-radius:12px;transition:background .15s}
    .sidebar-user:hover{background:#141414}
    .s-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0}
    .s-av img{width:100%;height:100%;object-fit:cover;display:block}

    /* ── MAIN ── */
    .main{margin-left:220px;flex:1;padding:28px;min-height:100vh;max-width:900px}
    .page-title{font-size:26px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
    .page-sub{font-size:13px;color:var(--text4);margin-top:4px;margin-bottom:24px}

    /* ── BALANCE HERO CARD ── */
    .balance-hero{background:linear-gradient(135deg,#0d0d24 0%,#1a1040 50%,#0d1824 100%);border:1px solid #2a2a5a;border-radius:22px;padding:28px 32px;margin-bottom:24px;position:relative;overflow:hidden}
    .balance-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(127,119,221,.15) 0%,transparent 70%);pointer-events:none}
    .balance-hero::after{content:'';position:absolute;bottom:-60px;left:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(0,212,255,.08) 0%,transparent 70%);pointer-events:none}
    .balance-label{font-size:13px;color:#5a5a9a;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
    .balance-amount{font-size:54px;font-weight:900;line-height:1;background:linear-gradient(135deg,#a09fff,#00D4FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .balance-kp-label{font-size:18px;color:#5a5a9a;font-weight:600;margin-left:6px}
    .balance-converted{margin-top:8px;font-size:15px;color:#7070aa}
    .currency-row{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
    .cur-btn{padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid #2a2a5a;background:transparent;color:#6060aa;cursor:pointer;transition:all .15s;font-family:inherit}
    .cur-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .cur-btn:hover{border-color:var(--accent);color:var(--accent)}
    .balance-stats{display:flex;gap:24px;margin-top:20px;padding-top:20px;border-top:1px solid #1a1a3a;flex-wrap:wrap}
    .b-stat{display:flex;flex-direction:column;gap:3px}
    .b-stat-num{font-size:18px;font-weight:800;color:var(--text)}
    .b-stat-label{font-size:11px;color:#5a5a9a}

    /* ── SEND BUTTON ROW ── */
    .action-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .action-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
    .action-btn.send{background:linear-gradient(135deg,var(--accent),var(--neon));color:#fff;box-shadow:0 4px 20px rgba(127,119,221,.4)}
    .action-btn.send:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(127,119,221,.5)}
    .action-btn.grey{background:#1a1a1a;color:var(--text2);border:1px solid var(--border2)}
    .action-btn.grey:hover{background:#222;color:var(--text)}

    /* ── TRANSFER MODAL ── */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .modal-overlay.open{display:flex;animation:fadeIn .25s ease}
    @keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    .modal{background:#111;border:1px solid #2a2a4a;border-radius:22px;padding:30px;width:100%;max-width:440px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.8)}
    .modal-title{font-size:18px;font-weight:900;margin-bottom:20px;display:flex;align-items:center;gap:8px}
    .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1;padding:4px}
    .modal-close:hover{color:var(--text)}
    .field-label{font-size:12px;color:var(--text3);margin-bottom:6px;margin-top:14px;display:block}
    .m-input{width:100%;background:#0f0f0f;border:1px solid var(--border2);border-radius:12px;padding:11px 16px;font-size:15px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s}
    .m-input:focus{border-color:var(--accent)}
    .user-suggest{background:#111;border:1px solid var(--border2);border-radius:12px;margin-top:4px;overflow:hidden;display:none}
    .suggest-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .12s}
    .suggest-item:hover{background:#1a1a1a}
    .suggest-av{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0}
    .suggest-av img{width:100%;height:100%;object-fit:cover}
    .amount-row{display:flex;gap:8px;margin-top:8px}
    .quick-amt{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border2);color:var(--text3);background:transparent;cursor:pointer;font-family:inherit;transition:all .15s}
    .quick-amt:hover{border-color:var(--accent);color:var(--accent)}
    .transfer-btn{width:100%;margin-top:20px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--neon));color:#fff;border:none;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s}
    .transfer-btn:hover{opacity:.9;transform:translateY(-1px)}
    .transfer-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .transfer-result{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:13px;display:none}
    .transfer-result.ok{background:#0a1f0a;border:1px solid #1a4a1a;color:#80f080}
    .transfer-result.err{background:#1f0a0a;border:1px solid #3a1010;color:#f08080}

    /* ── TABS ── */
    .tx-tabs{display:flex;gap:4px;margin-bottom:18px;background:#0d0d0d;padding:4px;border-radius:14px;border:1px solid var(--border)}
    .tx-tab{flex:1;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all .15s;text-align:center}
    .tx-tab.active{background:#1a1a1a;color:#fff}
    .tx-tab:hover:not(.active){color:var(--text2)}

    /* ── TRANSACTIONS ── */
    .tx-list{display:flex;flex-direction:column;gap:8px}
    .tx-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s,background .12s}
    .tx-card:hover{background:var(--card2);border-color:var(--border2)}
    .tx-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .tx-icon.in{background:#0a1f0a;border:1px solid #1a4a1a}
    .tx-icon.out{background:#1f0a0a;border:1px solid #3a1010}
    .tx-icon.shop{background:#0a0a1f;border:1px solid #1a1a4a}
    .tx-icon.reward{background:#1f1a00;border:1px solid #4a3a00}
    .tx-main{flex:1;min-width:0}
    .tx-who{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tx-comment{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tx-right{text-align:right;flex-shrink:0}
    .tx-amount{font-size:16px;font-weight:800}
    .tx-amount.in{color:var(--green)}
    .tx-amount.out{color:var(--red)}
    .tx-amount.shop{color:var(--accent)}
    .tx-time{font-size:11px;color:var(--text4);margin-top:3px}

    /* TX Detail modal */
    .tx-detail{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center}
    .tx-detail.open{display:flex;animation:fadeIn .2s ease}
    .tx-detail-card{background:#111;border:1px solid #2a2a4a;border-radius:20px;padding:28px;width:100%;max-width:380px}
    .tx-detail-title{font-size:17px;font-weight:800;margin-bottom:18px}
    .tx-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a;font-size:13px}
    .tx-row:last-child{border-bottom:none}
    .tx-row-label{color:var(--text3)}
    .tx-row-val{color:var(--text);font-weight:600;text-align:right;max-width:60%}

    /* ── EMPTY ── */
    .empty-tx{padding:60px 20px;text-align:center;color:var(--text4)}
    .empty-tx-icon{font-size:48px;margin-bottom:14px;opacity:.3}

    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:999px}
    @media(max-width:800px){.nav-item span,.nav-section-label,.sidebar-user>div:last-child{display:none}.main{margin-left:60px;padding:16px}
    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {
      font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: #555; text-decoration: none; position: relative;
      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .nav-item .icon {
      width: 34px; height: 34px; display: inline-flex;
      align-items: center; justify-content: center;
      border-radius: 12px; background: #12121d;
      flex-shrink: 0; transition: background 0.15s;
    }
    .nav-item .icon svg {
      width: 18px; height: 18px; display: block;
      stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }
    .nav-item .icon-logout svg { stroke: #7F77DD; }
    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-top: 1px solid #181818; margin-top: 8px;
      text-decoration: none; border-radius: 12px; transition: background 0.15s;
    }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }
    .kw-dot { width: 7px; height: 7px; background: #7F77DD; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 8px #7F77DD; animation: kwPulse 2s infinite; display: inline-block; }
    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    a[href="/wallet"]:hover { background: #0d0d1f !important; color: #a09fff !important; }
}
