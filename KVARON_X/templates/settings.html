<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KRX — Настройки</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: {% if user.theme == 'light' %}#f5f5f5{% else %}#0a0a0a{% endif %};
      --bg2: {% if user.theme == 'light' %}#fff{% else %}#111{% endif %};
      --bg3: {% if user.theme == 'light' %}#e8e8e8{% else %}#1a1a1a{% endif %};
      --text: {% if user.theme == 'light' %}#111{% else %}#fff{% endif %};
      --text2: {% if user.theme == 'light' %}#444{% else %}#ccc{% endif %};
      --text3: {% if user.theme == 'light' %}#777{% else %}#555{% endif %};
      --border: {% if user.theme == 'light' %}#ddd{% else %}#1e1e1e{% endif %};
      --border2: {% if user.theme == 'light' %}#ccc{% else %}#2a2a2a{% endif %};
      --accent: {{ user.accent_color or '#7F77DD' }};
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; }

    .sidebar {
      width: 220px; min-height: 100vh; background: var(--bg2);
      border-right: 1px solid var(--border); padding: 20px 12px;
      display: flex; flex-direction: column; gap: 4px;
      position: fixed; top: 0; left: 0; height: 100vh;
    }
    .logo { font-size: 22px; font-weight: 700; padding: 8px 12px 20px; color: var(--text); }
    .logo span { color: #444; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; font-size: 15px;
      color: var(--text3); text-decoration: none; position: relative;
    }
    .nav-item:hover { background: var(--bg3); color: var(--text2); }
    .nav-item.active { color: var(--text); background: var(--bg3); }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--accent); border-radius: 0 3px 3px 0;
    }
    .icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-div { height: 1px; background: var(--border); margin: 4px 12px; }
    .nav-spacer { flex: 1; }

    .content { margin-left: 220px; flex: 1; padding: 30px 20px; min-height: 100vh; max-width: 920px; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; color: var(--text); }

    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .settings-grid { grid-template-columns: 1fr; } }

    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .card-full { grid-column: 1 / -1; }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--text); }

    label { font-size: 12px; color: var(--text3); display: block; margin-bottom: 4px; }
    input[type=text], input[type=password], input[type=email], input[type=tel] {
      width: 100%; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 10px; padding: 9px 14px; font-size: 14px;
      color: var(--text); margin-bottom: 12px; outline: none;
    }
    input:focus { border-color: var(--accent); }

    .save-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 10px; padding: 9px 20px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.85; }
    .danger-btn {
      background: transparent; color: #f08080; border: 1px solid #3a1010;
      border-radius: 10px; padding: 9px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .danger-btn:hover { background: #1f0a0a; }

    .success { background: #0a1f0a; border: 1px solid #1a4a1a; color: #80f080; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    .error-box { background: #1f0a0a; border: 1px solid #3a1010; color: #f08080; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

    .theme-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .theme-opt {
      flex: 1; border-radius: 12px; padding: 14px;
      text-align: center; font-size: 14px; cursor: pointer;
      border: 2px solid var(--border2); transition: border-color 0.2s;
    }
    .theme-opt.dark-theme { background: #0a0a0a; color: #fff; }
    .theme-opt.light-theme { background: #f5f5f5; color: #111; }
    .theme-opt.selected { border-color: var(--accent); }

    .color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .color-pick {
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: border-color 0.15s, transform 0.1s;
    }
    .color-pick:hover { transform: scale(1.1); }
    .color-pick.selected { border-color: #fff; transform: scale(1.15); }

    .xp-bar-bg { background: var(--bg3); border-radius: 999px; height: 8px; overflow: hidden; margin-top: 10px; }
    .xp-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
    .milestones { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .milestone { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border2); color: var(--text3); }
    .milestone.reached { border-color: var(--accent); color: var(--accent); }

    .phone-status { font-size: 12px; margin-top: 6px; padding: 8px 12px; border-radius: 8px; }
    .phone-status.verified { background: #0a1f0a; color: #1D9E75; border: 1px solid #1a4a1a; }
    .phone-status.pending { background: #1a1500; color: #EF9F27; border: 1px solid #3a3000; }

    .reward-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .reward-item:last-child { border-bottom: none; }
    .reward-icon { font-size: 20px; }
    .reward-name { font-size: 13px; color: var(--text2); font-weight: 500; }
    .reward-req { font-size: 11px; color: var(--text3); }
    .reward-status { margin-left: auto; font-size: 11px; padding: 3px 8px; border-radius: 999px; }
    .reward-status.unlocked { background: #0a1f0a; color: #1D9E75; border: 1px solid #1a4a1a; }
    .reward-status.locked { background: var(--bg3); color: var(--text3); border: 1px solid var(--border2); }

    .user-preview { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--bg3); border-radius: 12px; margin-bottom: 16px; }
    .user-av { width: 54px; height: 54px; border-radius: 50%; background: #333; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .user-av img { width: 100%; height: 100%; object-fit: cover; }

    .email-pending { font-size: 11px; color: #EF9F27; margin-top: 4px; }
  
    .kw-dot{width:7px;height:7px;background:#7F77DD;border-radius:50%;margin-left:auto;flex-shrink:0;box-shadow:0 0 8px #7F77DD;animation:kwPulse 2s infinite;display:inline-block}
    @keyframes kwPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

    /* ===== SIDEBAR ===== */

      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {
      font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: #555; text-decoration: none; position: relative;
      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .nav-item .icon {
      width: 34px; height: 34px; display: inline-flex;
      align-items: center; justify-content: center;

    }
    .nav-item .icon svg {
      width: 18px; height: 18px; display: block;
      stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }

    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-top: 1px solid #181818; margin-top: 8px;
      text-decoration: none; border-radius: 12px; transition: background 0.15s;
    }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }

    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
