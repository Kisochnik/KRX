<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KisPar — Фото, баннер и музыка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; display: flex; }

    .sidebar {
      width: 220px; min-height: 100vh; background: #0d0d0d;
      border-right: 1px solid #1e1e1e; padding: 20px 12px;
      display: flex; flex-direction: column; gap: 4px;
      position: fixed; top: 0; left: 0; height: 100vh;
    }
    .logo { font-size: 22px; font-weight: 700; padding: 8px 12px 20px; }
    .logo span { color: #444; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; font-size: 15px;
      color: #666; text-decoration: none; position: relative;
    }
    .nav-item:hover { background: #151515; color: #aaa; }
    .nav-item.active { color: #fff; background: #151515; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; background: #7F77DD; border-radius: 0 3px 3px 0;
    }
    .nav-spacer { flex: 1; }

    .content {
      margin-left: 220px; flex: 1; display: flex;
      align-items: flex-start; justify-content: center;
      padding: 40px 20px; min-height: 100vh;
    }
    .card {
      background: #111; border: 1px solid #1e1e1e;
      border-radius: 16px; padding: 32px;
      width: 100%; max-width: 500px;
    }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: #555; margin-bottom: 24px; }

    .upload-section { margin-bottom: 22px; }
    .upload-label { font-size: 12px; color: #555; margin-bottom: 8px; display: block; }
    .upload-box {
      border: 1px dashed #2a2a2a; border-radius: 12px;
      padding: 20px; text-align: center; cursor: pointer;
      position: relative; overflow: hidden; transition: border-color 0.2s;
    }
    .upload-box:hover { border-color: #7F77DD; }
    .upload-box input[type=file] {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; opacity: 0; cursor: pointer;
    }
    .upload-icon { font-size: 26px; margin-bottom: 6px; }
    .upload-text { font-size: 14px; color: #555; }
    .upload-hint { font-size: 12px; color: #333; margin-top: 4px; }
    .upload-hint strong { color: #666; }

    .preview-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      object-fit: cover; margin-top: 12px; display: none;
      border: 3px solid #7F77DD;
    }
    .preview-banner {
      width: 100%; height: 90px; border-radius: 10px;
      object-fit: cover; margin-top: 10px; display: none;
    }
    .current-av {
      display: flex; align-items: center; gap: 10px; margin-top: 10px;
    }
    .current-av img {
      width: 44px; height: 44px; border-radius: 50%;
      object-fit: cover; border: 2px solid #333;
    }
    .current-av span { font-size: 12px; color: #444; }

    .music-name-input {
      width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 9px 14px; font-size: 14px;
      color: #eee; margin-top: 8px; outline: none;
      font-family: -apple-system, sans-serif;
    }
    .music-name-input:focus { border-color: #7F77DD; }

    .save-btn {
      width: 100%; background: #7F77DD; color: #fff; border: none;
      border-radius: 10px; padding: 12px; font-size: 15px;
      font-weight: 700; cursor: pointer; margin-top: 8px;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #6a63cc; }
    .back-link {
      display: block; text-align: center; margin-top: 14px;
      font-size: 13px; color: #555; text-decoration: none;
    }
    .back-link:hover { color: #aaa; }
    .error { background: #1f0a0a; border: 1px solid #3a1010; color: #f08080; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
    .success { background: #0a1f0a; border: 1px solid #1a4a1a; color: #80f080; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }

    @media (max-width: 700px) {
      .sidebar { width: 60px; }
      .nav-item span { display: none; }
      .content { margin-left: 60px; }
    }

    @keyframes kwPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

    /* ===== SIDEBAR ===== */

      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {

      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;

      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }

    }
    .nav-item .icon svg {

    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }
    .nav-item .icon-logout svg { stroke: #7F77DD; }
    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-top: 1px solid #181818; margin-top: 8px;
      text-decoration: none; border-radius: 12px; transition: background 0.15s;
    }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }
    .kw-dot { width: 7px; height: 7px; background: #7F77DD; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 8px #7F77DD; animation: kwPulse 2s infinite; display: inline-block; }
    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    a[href="/wallet"]:hover { background: #0d0d1f !important; color: #a09fff !important; }
}
