<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KRX — {{ target.username }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; display: flex; }

    .sidebar {
      width: 220px; min-height: 100vh; background: #0d0d0d;
      border-right: 1px solid #1e1e1e; padding: 20px 12px;
      display: flex; flex-direction: column; gap: 4px;
      position: fixed; top: 0; left: 0; height: 100vh;
    }
    .logo { font-size: 22px; font-weight: 700; padding: 8px 12px 20px; }
    .logo span { color: #444; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; font-size: 15px;
      color: #666; text-decoration: none; position: relative;
    }
    .nav-item:hover { background: #151515; color: #aaa; }
    .nav-item.active { color: #fff; background: #151515; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; background: #7F77DD; border-radius: 0 3px 3px 0;
    }
    .nav-spacer { flex: 1; }

    .main { margin-left: 220px; flex: 1; max-width: 700px; min-height: 100vh; border-right: 1px solid #1e1e1e; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 12px 20px; font-size: 14px; color: #555; text-decoration: none;
      border-bottom: 1px solid #1a1a1a; width: 100%;
    }
    .back-link:hover { color: #aaa; background: #0d0d0d; }

    .banner { height: 180px; background: #141414; position: relative; overflow: hidden; }
    .banner img.banner-img { width: 100%; height: 100%; object-fit: cover; }
    .banner-grid {
      width: 100%; height: 100%; opacity: 0.1;
      background-image: linear-gradient(#fff 1px, transparent 1px),
        linear-gradient(90deg, #fff 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .profile-area { padding: 0 24px 20px; }
    .avatar-row {
      display: flex; align-items: flex-end;
      justify-content: space-between;
      margin-top: -45px; padding-bottom: 12px;
    }
    .avatar-wrap {
      width: 90px; height: 90px; border-radius: 50%;
      border: 4px solid #0a0a0a; overflow: hidden;
      background: #333; flex-shrink: 0; z-index: 2; position: relative;
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-initials {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700; color: #fff;
    }

    .friend-btn {
      font-size: 13px; padding: 8px 18px; border-radius: 999px;
      border: 1px solid #333; color: #ccc; background: transparent;
      cursor: pointer; white-space: nowrap; align-self: flex-end;
      margin-bottom: 4px; text-decoration: none;
    }
    .friend-btn:hover { background: #1a1a1a; }
    .friend-btn.sent { border-color: #333; color: #444; cursor: default; }
    .friend-btn.accepted { border-color: #1D9E75; color: #1D9E75; cursor: default; }

    .online-indicator {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; margin-bottom: 6px;
    }
    .online-indicator .dot { width: 8px; height: 8px; border-radius: 50%; }
    .online-indicator.online .dot { background: #1D9E75; }
    .online-indicator.offline .dot { background: #444; }
    .online-indicator.online { color: #1D9E75; }
    .online-indicator.offline { color: #444; }

    .p-name-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .p-name { font-size: 20px; font-weight: 700; color: #f0f0f0; }
    .p-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1a1a1a; border: 1px solid #333; color: #aaa; }
    .p-badge.founder { background: #2a1a00; border-color: #8B6914; color: #FFD700; }
    .p-badge.top { background: #0a1a2a; border-color: #1a6aaa; color: #60aaff; }
    .p-badge.legend { background: #1a0a2a; border-color: #6a1aaa; color: #c060ff; }
    .p-level { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #111; border: 1px solid #222; color: #666; }
    .p-status { font-size: 18px; margin-top: 4px; }
    .p-handle { font-size: 14px; color: #555; margin-top: 2px; }
    .p-title { font-size: 12px; color: #444; margin-top: 2px; }
    .p-bio { font-size: 14px; color: #999; margin-top: 10px; line-height: 1.55; }
    .p-meta { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
    .p-meta span { font-size: 13px; color: #555; }

    .music-player {
      margin-top: 14px; background: #111; border: 1px solid #1e1e1e;
      border-radius: 12px; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .music-play-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #7F77DD; color: #fff; border: none;
      font-size: 14px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .music-play-btn:hover { background: #6a63cc; }
    .music-info { flex: 1; min-width: 0; }
    .music-track { font-size: 13px; color: #ccc; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .music-sub { font-size: 11px; color: #555; margin-top: 2px; }
    .music-wave { display: flex; align-items: center; gap: 2px; }
    .music-wave span { display: block; width: 3px; background: #333; border-radius: 2px; height: 8px; }
    .music-wave.playing span { background: #1D9E75; animation: wave 0.8s ease-in-out infinite; }
    .music-wave span:nth-child(2) { animation-delay: 0.1s; }
    .music-wave span:nth-child(3) { animation-delay: 0.2s; }
    .music-wave span:nth-child(4) { animation-delay: 0.3s; }
    @keyframes wave { 0%,100%{height:4px} 50%{height:16px} }

    .stats-row { display: flex; margin-top: 14px; padding-top: 14px; border-top: 1px solid #1a1a1a; }
    .stat-box { flex: 1; text-align: center; padding: 8px 0; border-right: 1px solid #1a1a1a; }
    .stat-box:last-child { border-right: none; }
    .stat-n { font-size: 18px; font-weight: 700; color: #e0e0e0; }
    .stat-l { font-size: 12px; color: #555; margin-top: 2px; }

    .tabs-bar { display: flex; border-bottom: 1px solid #1a1a1a; margin-top: 16px; }
    .tab { padding: 12px 20px; font-size: 14px; color: #555; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #fff; border-bottom-color: #7F77DD; }

    .post {
      padding: 16px 24px; border-bottom: 1px solid #1a1a1a;
      transition: background 0.15s;
    }
    .post:hover { background: #0d0d0d; }
    .post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .post-name { font-size: 14px; font-weight: 700; color: #e0e0e0; }
    .post-time { font-size: 12px; color: #333; }
    .post-text { font-size: 15px; color: #ccc; line-height: 1.55; }
    .post-media { margin-top: 10px; border-radius: 12px; overflow: hidden; }
    .post-media img { width: 100%; display: block; max-height: 400px; object-fit: cover; border-radius: 12px; }
    .post-media video { width: 100%; display: block; border-radius: 12px; }

    .empty-posts { padding: 50px 24px; text-align: center; color: #333; font-size: 14px; }

    .msg-btn {
      display: inline-block; font-size: 13px; padding: 8px 18px; border-radius: 999px;
      border: 1px solid #2a2a2a; color: #888; background: transparent;
      text-decoration: none; margin-left: 8px; align-self: flex-end; margin-bottom: 4px;
    }
    .msg-btn:hover { background: #1a1a1a; color: #ccc; }
    .notice { margin: 16px 0; padding: 14px 16px; border-radius: 14px; background: #111; border: 1px solid #222; color: #ddd; }
    .notice.error { background: #2a0f0f; border-color: #551111; color: #ffd6d6; }
    .report-box { margin-top: 14px; border: 1px solid #1a1a1a; border-radius: 14px; overflow: hidden; }
    .report-box summary { cursor: pointer; padding: 12px 16px; background: #121212; color: #ff8a8a; font-weight: 700; list-style:none; }
    .report-form { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #080808; }
    .report-form textarea { width: 100%; min-height: 86px; padding: 12px; border-radius: 14px; border: 1px solid #222; background: #090909; color: #eee; resize: vertical; }

    @media (max-width: 700px) {
      .sidebar { width: 60px; }
      .nav-item span { display: none; }
      .main { margin-left: 60px; }
    }

    @keyframes kwPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

    /* ===== SIDEBAR ===== */

      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {
      font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: #555; text-decoration: none; position: relative;
      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .nav-item .icon {
      width: 34px; height: 34px; display: inline-flex;
      align-items: center; justify-content: center;
      border-radius: 12px; background: #12121d;
      flex-shrink: 0; transition: background 0.15s;
    }
    .nav-item .icon svg {
      width: 18px; height: 18px; display: block;
      stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }
    .nav-item .icon-logout svg { stroke: #7F77DD; }
    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-top: 1px solid #181818; margin-top: 8px;
      text-decoration: none; border-radius: 12px; transition: background 0.15s;
    }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }

    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
