<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRX Music</title>
  <style>
    :root {
      --bg: #080808;
      --bg2: #0f0f0f;
      --bg3: #161616;
      --card: #111111;
      --card2: #181818;
      --border: #1e1e1e;
      --border2: #2a2a2a;
      --text: #f0f0f0;
      --text2: #aaa;
      --text3: #666;
      --text4: #3a3a3a;
      --red: #e0245e;
      --red2: #c0103e;
      --accent: #7F77DD;
      --green: #1DB954;
      --player-h: 88px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }/* ===== MAIN ===== */
    .main {
      margin-left: 240px;
      flex: 1;
      padding-bottom: calc(var(--player-h) + 20px);
      min-height: 100vh;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {
      font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: #555; text-decoration: none; position: relative;
      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .nav-item .icon {
      width: 34px; height: 34px; display: inline-flex;
      align-items: center; justify-content: center;
      border-radius: 12px; background: #12121d;
      flex-shrink: 0; transition: background 0.15s;
    }
    .nav-item .icon svg {
      width: 18px; height: 18px; display: block;
      stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }
    .nav-item .icon-logout svg { stroke: #7F77DD; }
    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-top: 1px solid #181818; margin-top: 8px;
      text-decoration: none; border-radius: 12px; transition: background 0.15s;
    }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }
    .kw-dot { width: 7px; height: 7px; background: #7F77DD; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 8px #7F77DD; animation: kwPulse 2s infinite; display: inline-block; }
    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    a[href="/wallet"]:hover { background: #0d0d1f !important; color: #a09fff !important; }

    /* ===== HERO ===== */
    .music-hero {
      position: relative; overflow: hidden;
      padding: 48px 32px 40px;
      background: linear-gradient(160deg, #1a0a0f 0%, #0f0a1a 40%, #080808 100%);
    }
    .hero-bg-blur {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .hero-bg-blur::before {
      content: ''; position: absolute;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(224,36,94,0.15), transparent 70%);
      top: -100px; right: -50px;
    }
    .hero-bg-blur::after {
      content: ''; position: absolute;
      width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(127,119,221,0.1), transparent 70%);
      bottom: -80px; left: 100px;
    }

    .hero-content { position: relative; z-index: 1; }
    .hero-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--red); margin-bottom: 10px;
    }
    .hero-title { font-size: 40px; font-weight: 900; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 8px; }
    .hero-title span { color: var(--red); }
    .hero-sub { font-size: 15px; color: var(--text3); margin-bottom: 28px; }

    .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--red); color: #fff; border: none;
      border-radius: 999px; padding: 12px 26px; font-size: 14px; font-weight: 800;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 6px 24px rgba(224,36,94,0.35);
      letter-spacing: 0.2px;
    }
    .btn-primary:hover { background: var(--red2); transform: scale(1.04); box-shadow: 0 8px 32px rgba(224,36,94,0.45); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.07); color: var(--text2);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 999px;
      padding: 11px 22px; font-size: 14px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    /* ===== SEARCH ===== */
    .search-section { padding: 20px 32px 0; }
    .search-wrap { display: flex; gap: 10px; margin-bottom: 18px; }
    .search-input {
      flex: 1; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 999px; padding: 11px 20px; font-size: 14px;
      color: var(--text); outline: none; font-family: inherit;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--red); background: #1a1a1a; }
    .search-input::placeholder { color: var(--text4); }
    .search-go { background: var(--red); color: #fff; border: none; border-radius: 999px; padding: 11px 22px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
    .search-go:hover { background: var(--red2); }

    /* Genre tags */
    .genre-strip { display: flex; gap: 8px; flex-wrap: wrap; }
    .genre-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
      border: 1px solid var(--border2); color: var(--text3); background: transparent;
      white-space: nowrap;
    }
    .genre-pill:hover { border-color: var(--red); color: var(--text2); background: #1a0a0e; }
    .genre-pill.active { background: var(--red); color: #fff; border-color: var(--red); }

    /* ===== TABS ===== */
    .music-tabs {
      display: flex; gap: 0; padding: 24px 32px 0;
      border-bottom: 1px solid var(--border); position: sticky; top: 0;
      background: rgba(8,8,8,0.97); z-index: 50; backdrop-filter: blur(14px);
    }
    .m-tab {
      padding: 12px 20px 10px; font-size: 14px; font-weight: 600; color: var(--text3);
      cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .m-tab:hover { color: var(--text2); }
    .m-tab.active { color: #fff; border-bottom-color: var(--red); }

    /* ===== SECTIONS ===== */
    .section { padding: 28px 32px 0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .section-more { font-size: 13px; color: var(--text3); text-decoration: none; transition: color 0.15s; }
    .section-more:hover { color: var(--red); }

    /* tab panes */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ===== TRACK GRID ===== */
    .tracks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }

    .track-card {
      background: var(--card2); border-radius: 16px; overflow: hidden;
      cursor: pointer; transition: all 0.22s; position: relative;
      border: 1px solid transparent;
    }
    .track-card:hover { background: #1f1f1f; transform: translateY(-4px); border-color: #2a2a2a; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .track-card.is-playing { border-color: var(--red); background: #1a0810; }

    .tc-cover {
      width: 100%; aspect-ratio: 1; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .tc-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .track-card:hover .tc-cover img { transform: scale(1.06); }
    .tc-cover-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 52px;
    }

    /* Play button overlay */
    .tc-play-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
    }
    .track-card:hover .tc-play-overlay, .track-card.is-playing .tc-play-overlay { opacity: 1; }
    .tc-play-circle {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--red); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; transition: transform 0.15s;
      box-shadow: 0 4px 20px rgba(224,36,94,0.5);
    }
    .tc-play-circle:hover { transform: scale(1.1); }

    /* Visualizer bars (playing animation) */
    .tc-visualizer {
      position: absolute; bottom: 10px; right: 10px;
      display: none; align-items: flex-end; gap: 2px; height: 20px;
    }
    .track-card.is-playing .tc-visualizer { display: flex; }
    .vis-bar {
      width: 3px; background: var(--red); border-radius: 2px;
      animation: visPulse 0.8s ease-in-out infinite;
    }
    .vis-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .vis-bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .vis-bar:nth-child(3) { height: 18px; animation-delay: 0.2s; }
    .vis-bar:nth-child(4) { height: 12px; animation-delay: 0.3s; }
    .vis-bar:nth-child(5) { height: 16px; animation-delay: 0.15s; }
    @keyframes visPulse {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .tc-info { padding: 12px 14px 14px; }
    .tc-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tc-artist { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
    .tc-actions { display: flex; align-items: center; gap: 6px; }
    .tc-act {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600; color: var(--text4);
      background: none; border: none; cursor: pointer; padding: 5px 8px;
      border-radius: 8px; transition: all 0.15s; font-family: inherit;
    }
    .tc-act:hover { background: #2a2a2a; color: var(--text2); }
    .tc-act.liked { color: var(--red); }
    .tc-act.saved { color: var(--accent); }
    .tc-act.share { margin-left: auto; }
    .tc-plays { font-size: 11px; color: var(--text4); margin-left: auto; }

    /* ===== LIST TRACK ===== */
    .tracks-list { display: flex; flex-direction: column; gap: 2px; }
    .tl-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 12px;
      cursor: pointer; transition: background 0.12s;
    }
    .tl-item:hover { background: var(--bg3); }
    .tl-item.is-playing { background: #1a0810; }
    .tl-num { width: 26px; text-align: center; font-size: 13px; color: var(--text4); flex-shrink: 0; font-weight: 600; }
    .tl-item.is-playing .tl-num { color: var(--red); }
    .tl-cover {
      width: 46px; height: 46px; border-radius: 10px; overflow: hidden;
      background: var(--bg3); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .tl-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tl-info { flex: 1; min-width: 0; }
    .tl-title { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tl-artist { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .tl-dur { font-size: 12px; color: var(--text4); flex-shrink: 0; }
    .tl-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tl-act { background: none; border: none; color: var(--text4); cursor: pointer; font-size: 17px; padding: 4px 6px; border-radius: 8px; transition: all 0.12s; }
    .tl-act:hover { color: var(--text2); background: #2a2a2a; }
    .tl-act.liked { color: var(--red); }
    .tl-act.saved { color: var(--accent); }

    /* ===== UPLOAD ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(6px); }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: #131313; border: 1px solid var(--border2); border-radius: 20px; padding: 28px; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-close { background: var(--bg3); border: none; color: var(--text3); font-size: 18px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .modal-close:hover { background: #2a2a2a; color: var(--text); }

    .drop-zone {
      border: 2px dashed var(--border2); border-radius: 14px; padding: 32px 20px;
      text-align: center; cursor: pointer; position: relative; overflow: hidden;
      transition: all 0.2s; margin-bottom: 16px;
    }
    .drop-zone:hover, .drop-zone.drag { border-color: var(--red); background: #1a0810; }
    .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop-icon { font-size: 44px; margin-bottom: 10px; }
    .drop-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .drop-sub { font-size: 13px; color: var(--text3); }
    .drop-file-name { font-size: 13px; color: var(--red); font-weight: 600; margin-top: 8px; display: none; }

    .cover-row { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; }
    .cover-preview { width: 72px; height: 72px; border-radius: 12px; overflow: hidden; background: var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; position: relative; transition: all 0.15s; border: 2px dashed var(--border2); }
    .cover-preview:hover { border-color: var(--red); }
    .cover-preview input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
    .cover-info { flex: 1; }
    .cover-label { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
    .cover-hint { font-size: 12px; color: var(--text3); }

    .form-row { margin-bottom: 12px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text3); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 10px; padding: 10px 14px; font-size: 14px; color: var(--text);
      outline: none; font-family: inherit; transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--red); }
    .form-select option { background: #1a1a1a; }
    .form-textarea { resize: none; height: 70px; }

    .upload-progress { display: none; margin-bottom: 14px; }
    .prog-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
    .prog-bg { background: var(--bg3); border-radius: 999px; height: 4px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--red); border-radius: 999px; width: 0; transition: width 0.3s; }

    .submit-btn { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 800; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 20px rgba(224,36,94,0.3); }
    .submit-btn:hover { background: var(--red2); transform: scale(1.02); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ===== PLAYLIST MODAL ===== */
    .pl-modal { background: #131313; border: 1px solid var(--border2); border-radius: 20px; padding: 24px; width: 100%; max-width: 360px; }

    /* ===== EMPTY STATE ===== */
    .empty-state { padding: 60px 20px; text-align: center; }
    .empty-visual { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #1a0810, #0f0a1a); margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .empty-title { font-size: 20px; font-weight: 700; color: #555; margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: #333; margin-bottom: 20px; line-height: 1.6; }

    /* ===== PLAYER ===== */
    .player {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--player-h);
      background: rgba(10,10,10,0.97);
      border-top: 1px solid #1e1e1e;
      backdrop-filter: blur(24px) saturate(180%);
      display: flex; align-items: center;
      padding: 0 20px; gap: 16px; z-index: 300;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .player.visible { transform: translateY(0); }

    /* Player track info */
    .p-track { display: flex; align-items: center; gap: 12px; width: 280px; flex-shrink: 0; min-width: 0; }
    .p-cover {
      width: 56px; height: 56px; border-radius: 10px; overflow: hidden;
      background: var(--bg3); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      position: relative;
    }
    .p-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p-cover-spin { animation: coverSpin 8s linear infinite; }
    @keyframes coverSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .p-info { flex: 1; min-width: 0; }
    .p-title { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-artist { font-size: 12px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-heart { background: none; border: none; color: var(--text4); font-size: 20px; cursor: pointer; padding: 6px; transition: color 0.15s; flex-shrink: 0; }
    .p-heart:hover { color: var(--red); }
    .p-heart.liked { color: var(--red); }

    /* Player controls */
    .p-controls { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
    .p-btns { display: flex; align-items: center; gap: 14px; }
    .p-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; padding: 6px; transition: all 0.15s; border-radius: 50%; }
    .p-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .p-btn.active { color: var(--red); }
    .p-play {
      width: 44px; height: 44px; border-radius: 50%;
      background: #fff; color: #000; border: none;
      font-size: 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .p-play:hover { transform: scale(1.08); background: #f0f0f0; }
    .p-play.playing { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(224,36,94,0.4); }
    .p-play.playing:hover { background: var(--red2); }

    /* Visualizer in player */
    .p-visualizer {
      display: none; align-items: flex-end; gap: 2px; height: 18px; margin-left: 6px;
    }
    .p-visualizer.show { display: flex; }
    .pv-bar { width: 3px; background: var(--red); border-radius: 2px; animation: visPulse 0.7s ease-in-out infinite; }
    .pv-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
    .pv-bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .pv-bar:nth-child(3) { height: 18px; animation-delay: 0.2s; }
    .pv-bar:nth-child(4) { height: 10px; animation-delay: 0.05s; }

    .p-progress { display: flex; align-items: center; gap: 10px; width: 100%; }
    .p-time { font-size: 11px; color: var(--text4); min-width: 34px; }
    .p-time.right { text-align: right; }
    .p-bar {
      flex: 1; height: 4px; background: #2a2a2a; border-radius: 999px;
      cursor: pointer; position: relative; group: hover;
      transition: height 0.15s;
    }
    .p-bar:hover { height: 6px; }
    .p-bar-fill { height: 100%; background: var(--red); border-radius: 999px; pointer-events: none; transition: width 0.1s linear; }
    .p-bar::after { content: ''; position: absolute; right: calc(100% - var(--pct, 0) * 1%); top: 50%; transform: translate(50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
    .p-bar:hover::after { opacity: 1; }

    /* Player right */
    .p-right { width: 220px; display: flex; align-items: center; gap: 10px; justify-content: flex-end; flex-shrink: 0; }
    .vol-icon { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; padding: 4px; }
    .vol-icon:hover { color: #fff; }
    .vol-bar { width: 80px; height: 4px; background: #2a2a2a; border-radius: 999px; cursor: pointer; position: relative; flex-shrink: 0; }
    .vol-fill { height: 100%; background: var(--text3); border-radius: 999px; width: 70%; transition: background 0.15s; }
    .vol-bar:hover .vol-fill { background: #fff; }
    .p-queue-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 8px; transition: all 0.15s; }
    .p-queue-btn:hover { color: #fff; background: #2a2a2a; }

    /* ===== COVER GRADIENTS (placeholder) ===== */
    .cg-0 { background: linear-gradient(135deg, #1a0a1a, #4a1040); }
    .cg-1 { background: linear-gradient(135deg, #0a1a1a, #104040); }
    .cg-2 { background: linear-gradient(135deg, #1a1a0a, #403010); }
    .cg-3 { background: linear-gradient(135deg, #0a0a1a, #101040); }
    .cg-4 { background: linear-gradient(135deg, #1a0a0a, #401010); }
    .cg-5 { background: linear-gradient(135deg, #0a1a0a, #104010); }

    /* ===== TOAST ===== */
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px); background: #1a1a1a; border: 1px solid #333; color: var(--text2); border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: 600; z-index: 9999; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 999px; }

    @media (max-width: 900px) { .p-right { display: none; } .p-track { width: 180px; } }
    @media (max-width: 700px) {
      
      .nav-item span, .nav-section-label, .sidebar-user > div:last-child, .logo sup { display: none; }
      .main { margin-left: 60px; }
      .hero-title { font-size: 28px; }
      .tracks-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    }
