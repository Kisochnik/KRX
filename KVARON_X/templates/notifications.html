<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRX — Уведомления</title>
  <style>
    :root {
      --bg: #080808; --bg2: #0f0f0f; --bg3: #161616;
      --card: #111; --card2: #181818;
      --border: #1e1e1e; --border2: #2a2a2a;
      --text: #f0f0f0; --text2: #aaa; --text3: #666; --text4: #3a3a3a;
      --red: #e0245e; --red2: #c0103e;
      --green: #1D9E75; --accent: #7F77DD; --gold: #EF9F27;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; display: flex; min-height: 100vh; }

    /* SIDEBAR */
    
    .logo { font-size: 22px; font-weight: 900; padding: 6px 12px 16px; letter-spacing: -1px; }
    .logo span { color: #333; }
    .nav-section-label { font-size: 10px; color: #222; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 12px 4px; }
    
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a1a; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; background: var(--red); border-radius: 0 4px 4px 0; }
    
    .icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 2px 7px; }
    .nav-div { height: 1px; background: #161616; margin: 6px 10px; }
    .nav-spacer { flex: 1; }
    .sidebar-user { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-top: 1px solid #161616; margin-top: 6px; text-decoration: none; border-radius: 12px; transition: background 0.15s; }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; font-size: 14px; color: var(--red); text-decoration: none; font-weight: 700; background: #150608; border: 1px solid #2a0a10; transition: all 0.15s; }
    .admin-nav:hover { background: #1d080e; }
    .admin-nav .icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .admin-nav .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* MAIN */
    .main { margin-left: 220px; flex: 1; max-width: 700px; min-height: 100vh; border-right: 1px solid var(--border); }

    /* HEADER */
    .page-header { padding: 20px 24px 0; position: sticky; top: 0; background: rgba(8,8,8,0.97); z-index: 50; backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .page-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
    .unread-pill { font-size: 12px; font-weight: 700; background: var(--red); color: #fff; border-radius: 999px; padding: 3px 10px; }
    .header-actions { display: flex; gap: 8px; }
    .mark-all-btn { font-size: 13px; color: var(--text3); background: transparent; border: 1px solid var(--border2); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: all 0.15s; text-decoration: none; font-family: inherit; }
    .mark-all-btn:hover { background: #1a1a1a; color: var(--text2); }

    /* Filter tabs */
    .filter-tabs { display: flex; gap: 0; overflow-x: auto; }
    .filter-tabs::-webkit-scrollbar { height: 0; }
    .f-tab { padding: 10px 16px 8px; font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer; border-bottom: 2.5px solid transparent; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
    .f-tab:hover { color: var(--text2); }
    .f-tab.active { color: #fff; border-bottom-color: var(--red); }

    /* NOTIF SECTIONS */
    .section-label { padding: 14px 24px 8px; font-size: 11px; font-weight: 700; color: var(--text4); text-transform: uppercase; letter-spacing: 1px; }

    /* NOTIF ITEM */
    .notif-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; border-bottom: 1px solid #111;
      transition: background 0.12s; cursor: pointer;
    }
    .notif-item:hover { background: #0d0d0d; }
    .notif-item.is-new { background: #0d0d14; border-left: 3px solid var(--red); padding-left: 21px; }
    .notif-item.is-new:hover { background: #101018; }

    .notif-icon-wrap {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; position: relative;
    }
    .notif-av { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #222; }
    .notif-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .notif-av-init { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #1a1a2e, #2a1a2e); }

    /* Small icon badge on avatar */
    .notif-type-badge {
      position: absolute; bottom: -2px; right: -2px;
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--bg);
      display: flex; align-items: center; justify-content: center; font-size: 10px;
    }
    .badge-like { background: var(--red); }
    .badge-comment { background: var(--accent); }
    .badge-friend { background: var(--green); }
    .badge-follow { background: #378ADD; }
    .badge-xp { background: var(--gold); }
    .badge-system { background: #555; }

    .notif-body { flex: 1; min-width: 0; }
    .notif-text { font-size: 14px; color: var(--text2); line-height: 1.5; }
    .notif-text strong { color: var(--text); font-weight: 700; }
    .notif-time { font-size: 11px; color: var(--text4); margin-top: 3px; }
    .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; }

    /* Preview image */
    .notif-preview { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: #222; flex-shrink: 0; }
    .notif-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* EMPTY STATE */
    .empty-state { padding: 60px 24px; text-align: center; }
    .empty-icon { font-size: 54px; margin-bottom: 16px; opacity: 0.3; }
    .empty-title { font-size: 18px; font-weight: 700; color: #444; margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: #2a2a2a; line-height: 1.6; }

    /* NOTIF SETTINGS PANEL */
    .settings-panel { padding: 14px 24px; background: #0d0d0d; border-bottom: 1px solid var(--border); display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .setting-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); cursor: pointer; }
    .setting-toggle input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--red); }
    .save-settings-btn { font-size: 12px; background: var(--red); color: #fff; border: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: inherit; font-weight: 700; transition: all 0.15s; margin-left: auto; }
    .save-settings-btn:hover { background: var(--red2); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 999px; }

    @media (max-width: 800px) {
      
      .nav-item span, .nav-section-label, .sidebar-user > div:last-child { display: none; }
      .main { margin-left: 60px; }
    }
  
    .kw-dot{width:7px;height:7px;background:#7F77DD;border-radius:50%;margin-left:auto;flex-shrink:0;box-shadow:0 0 8px #7F77DD;animation:kwPulse 2s infinite;display:inline-block}
    @keyframes kwPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

    .badge-warn { background: #2a0a00 !important; color: #ff6600 !important; border-color: #4a1a00 !important; }
    .badge-report { background: #2a0000 !important; color: #ff4444 !important; border-color: #4a0000 !important; }
    .notif-item[data-type="admin_warning"] { border-left: 3px solid #ff6600 !important; background: #120800 !important; }
    .notif-item[data-type="report"] { border-left: 3px solid #ff4444 !important; 
    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {
      font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: #555; text-decoration: none; position: relative;
      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);

      border-radius: 0 4px 4px 0;
    }
    .nav-item .icon {
      width: 34px; height: 34px; display: inline-flex;
      align-items: center; justify-content: center;
      border-radius: 12px; background: #12121d;
      flex-shrink: 0; transition: background 0.15s;
    }
    .nav-item .icon svg {
      width: 18px; height: 18px; display: block;
      stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }
    .nav-item .icon-logout svg { stroke: #7F77DD; }
    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }

      display: flex; align-items: center; gap: 10px;

    }
    .sidebar-user:hover { background: #141414; }

    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }

      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }
    .kw-dot { width: 7px; height: 7px; background: #7F77DD; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 8px #7F77DD; animation: kwPulse 2s infinite; display: inline-block; }
    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

}
