<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KRX — Опросы</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --card: #121212; --border: #1e1e1e; --border2: #2a2a2a;
      --text: #f0f0f0; --text2: #aaa; --accent: #7F77DD; --accent2: #6a63cc;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #0d0d0d; border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 6px; position: fixed; inset: 0 auto auto 0; overflow-y: auto; }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 8px 16px; letter-spacing: -1px; }
    .nav-section-label { font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 8px 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; color: #777; text-decoration: none; transition: background .15s, color .15s; }
    .nav-item:hover { background: #141414; color: #ccc; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item .icon { width: 22px; text-align: center; }
    .nav-badge { margin-left: auto; background: #e0245e; color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 11px; }
    .sidebar-user { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid #171717; border-radius: 12px; text-decoration: none; color: #ddd; }
    .sidebar-user img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .main { margin-left: 240px; flex: 1; padding: 24px; max-width: 1160px; }
    .page-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .page-title { font-size: 28px; font-weight: 900; }
    .page-sub { color: var(--text2); font-size: 14px; }
    .section-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .section-title { font-size: 18px; font-weight: 800; }
    .section-action { color: var(--accent); text-decoration: none; font-size: 13px; }
    .poll-grid { display: grid; gap: 16px; }
    .poll-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
    .poll-question { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
    .poll-meta { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
    .poll-user-info { margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .poll-user-info img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .poll-options { display: grid; gap: 10px; }
    .poll-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--border2); border-radius: 14px; background: #111; cursor: pointer; transition: border-color .15s, transform .15s; }
    .poll-option:hover { border-color: var(--accent); transform: translateY(-1px); }
    .poll-option.selected { border-color: var(--accent); background: rgba(127,119,221,0.18); }
    .poll-option-text { font-size: 14px; font-weight: 600; }
    .poll-option-detail { font-size: 12px; color: var(--text2); }
    .empty-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 24px; text-align: center; color: #888; }
    @media(max-width: 900px) { .sidebar { position: static; width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; justify-content: space-between; } .main { margin-left: 0; padding: 16px; } 
    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {
      font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: #555; text-decoration: none; position: relative;
      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .nav-item .icon {
      width: 34px; height: 34px; display: inline-flex;
      align-items: center; justify-content: center;
      border-radius: 12px; background: #12121d;
      flex-shrink: 0; transition: background 0.15s;
    }
    .nav-item .icon svg {
      width: 18px; height: 18px; display: block;
      stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }
    .nav-item .icon-logout svg { stroke: #7F77DD; }
    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-top: 1px solid #181818; margin-top: 8px;
      text-decoration: none; border-radius: 12px; transition: background 0.15s;
    }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }
    .kw-dot { width: 7px; height: 7px; background: #7F77DD; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 8px #7F77DD; animation: kwPulse 2s infinite; display: inline-block; }
    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    a[href="/wallet"]:hover { background: #0d0d1f !important; color: #a09fff !important; }
}
