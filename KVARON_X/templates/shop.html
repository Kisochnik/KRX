<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRX — Магазин</title>
  <style>
    :root {
      --bg:#080808; --bg2:#0f0f0f; --bg3:#161616;
      --card:#111; --card2:#181818;
      --border:#1e1e1e; --border2:#2a2a2a;
      --text:#f0f0f0; --text2:#aaa; --text3:#666; --text4:#3a3a3a;
      --red:#e0245e; --red2:#c0103e;
      --green:#1D9E75; --accent:#7F77DD; --gold:#EF9F27;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;display:flex;min-height:100vh}

    /* ── SIDEBAR ── */
    
    .logo{font-size:22px;font-weight:900;padding:6px 12px 16px;letter-spacing:-1px}
    .logo span{color:#333}
    .nav-section-label{font-size:10px;color:#222;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:8px 12px 4px}
    
    .nav-item:hover{background:#141414;color:#bbb}
    .nav-item.active{color:#fff;background:#1a1a1a}
    .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--red);border-radius:0 4px 4px 0}
    
    .icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
    .nav-div{height:1px;background:#161616;margin:6px 10px}
    .nav-spacer{flex:1}
    .sidebar-user{display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid #161616;margin-top:6px;text-decoration:none;border-radius:12px;transition:background .15s}
    .sidebar-user:hover{background:#141414}
    .s-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0}
    .s-av img{width:100%;height:100%;object-fit:cover;display:block}
    .balance-mobile{display:none}
    .admin-nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:14px;color:var(--red);text-decoration:none;font-weight:700;background:#150608;border:1px solid #2a0a10;transition:all .15s}
    .admin-nav:hover{background:#1d080e}

    /* ── MAIN ── */
    .main{margin-left:220px;flex:1;padding:28px 28px 60px;min-height:100vh;max-width:1000px}
    .page-header{margin-bottom:24px}
    .page-title{font-size:26px;font-weight:900;letter-spacing:-.5px}
    .page-sub{font-size:14px;color:var(--text3);margin-top:4px}

    /* ── KP BALANCE CARD ── */
    .balance-card{background:linear-gradient(135deg,#0d0d20,#1a1030);border:1px solid #2a2a4a;border-radius:18px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .balance-icon{display:flex;align-items:center;justify-content:center}
    .balance-main{flex:1;min-width:140px}
    .balance-val{font-size:34px;font-weight:900;color:var(--accent);line-height:1}
    .balance-label{font-size:13px;color:#555;margin-top:3px}
    .balance-earn{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
    .earn-pill{background:#111;border:1px solid var(--border2);border-radius:999px;padding:5px 12px;font-size:11px;color:var(--text3)}
    .earn-pill span{color:var(--accent);font-weight:700}

    /* ── SEARCH BAR ── */
    .search-block{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .search-input{flex:1;min-width:180px;background:#0f0f0f;border:1px solid var(--border2);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--text);outline:none;font-family:inherit}
    .search-input:focus{border-color:var(--accent)}
    .search-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
    .search-btn:hover{opacity:.85}
    .search-label{font-size:13px;color:var(--text3);white-space:nowrap}

    /* ── CATEGORY TABS ── */
    .cat-tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
    .cat-tab{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--border2);color:var(--text3);cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;background:transparent}
    .cat-tab:hover{border-color:var(--accent);color:var(--accent)}
    .cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    /* ── SHOP GRID ── */
    .section-title{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:36px}

    .shop-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:border-color .15s,transform .15s;position:relative}
    .shop-card:hover{border-color:var(--border2);transform:translateY(-2px)}
    .shop-card.owned-card{border-color:var(--green)}
    .shop-card.owned-card::after{content:'✓';position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}

    .shop-preview{width:100%;aspect-ratio:1;background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
    .shop-preview.banner-prev{aspect-ratio:3/1}
    .shop-preview.color-prev{aspect-ratio:1;font-size:36px}
    .shop-preview.effect-prev{aspect-ratio:1;background:linear-gradient(135deg,#0d0d20,#200d20)}
    .shop-preview img{width:100%;height:100%;object-fit:cover;display:block}
    .shop-preview-empty{font-size:44px;color:#2a2a2a}

    .shop-info{padding:12px}
    .shop-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .shop-desc{font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.4;height:30px;overflow:hidden}
    .shop-price{display:flex;align-items:center;gap:6px;margin-bottom:10px}
    .price-num{font-size:15px;font-weight:800;color:var(--accent)}
    .price-label{font-size:11px;color:var(--text3)}
    .shop-id{font-size:10px;color:var(--text4);margin-bottom:6px}

    .shop-btn{width:100%;padding:8px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
    .shop-btn.buy{background:var(--accent);color:#fff}
    .shop-btn.buy:hover{opacity:.85}
    .shop-btn.equip{background:var(--green);color:#fff}
    .shop-btn.equip:hover{opacity:.85}
    .shop-btn.owned{background:#0a1f0a;color:var(--green);border:1px solid #1a4a1a;cursor:default}
    .shop-btn.no-kp{background:#1a1a1a;color:#333;cursor:not-allowed}

    /* ── ALERTS ── */
    .alert{border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13px;display:flex;align-items:center;gap:10px}
    .alert.success{background:#0a1f0a;border:1px solid #1a4a1a;color:#80f080}
    .alert.error{background:#1f0a0a;border:1px solid #3a1010;color:#f08080}
    .alert.info{background:#0a0a1f;border:1px solid #1a1a4a;color:#8080f0}

    /* ── DAILY QUESTS ── */
    .quests-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:28px}
    .quest-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:border-color .15s}
    .quest-card:hover{border-color:var(--border2)}
    .quest-card.done{border-color:var(--green)}
    .quest-icon{font-size:24px;flex-shrink:0}
    .quest-name{font-size:13px;font-weight:600;color:var(--text2)}
    .quest-reward{font-size:11px;color:var(--accent);margin-top:2px}
    .quest-check{margin-left:auto;font-size:16px;color:var(--green)}

    /* ── LEADERBOARD ── */
    .leaderboard-section{margin-top:8px;margin-bottom:36px}
    .lb-tabs{display:flex;gap:0;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .lb-tab{flex:1;padding:10px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;color:var(--text3);transition:all .15s;border:none;background:transparent;font-family:inherit}
    .lb-tab.active{background:var(--accent);color:#fff}
    .lb-pane{display:none}
    .lb-pane.active{display:block}

    .lb-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background .12s}
    .lb-row:last-child{border-bottom:none}
    .lb-row:hover{background:#0d0d0d}
    .lb-rank{font-size:18px;font-weight:900;min-width:36px;text-align:center}
    .rank-1{color:var(--gold)}
    .rank-2{color:#C0C0C0}
    .rank-3{color:#CD7F32}
    .rank-n{color:var(--text4)}
    .lb-av{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0}
    .lb-av img{width:100%;height:100%;object-fit:cover;display:block}
    .lb-name{flex:1;font-size:14px;font-weight:700;color:var(--text);text-decoration:none}
    .lb-name:hover{color:var(--accent)}
    .lb-val{font-size:15px;font-weight:800;color:var(--accent)}
    .lb-val.xp-col{color:var(--red)}
    .lb-me{background:#0a0a1a;border-left:3px solid var(--accent)}

    /* ── EMPTY ── */
    .empty-shop{padding:60px 20px;text-align:center;color:var(--text4)}
    .empty-icon{font-size:52px;margin-bottom:14px;opacity:.4}
    .empty-title{font-size:17px;color:#444;font-weight:700}
    .empty-sub{font-size:13px;color:#2a2a2a;margin-top:6px}

    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:999px}

    @media(max-width:800px){
      
      .nav-item span,.nav-section-label,.sidebar-user>div:last-child{display:none}
      .sidebar-user .balance-mobile{display:block !important}
      .main{margin-left:60px;padding:16px}
    
    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px; background: #0d0d0d; border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0; height: 100vh; overflow-y: auto;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 900; padding: 8px 12px 18px; letter-spacing: -1px; }
    .logo span { color: #444; }
    .logo sup { font-size: 10px; color: var(--accent); vertical-align: super; }
    .nav-section-label {
      font-size: 10px; color: #2a2a2a; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 10px 14px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: #555; text-decoration: none; position: relative;
      transition: all 0.15s; font-weight: 500; user-select: none;
    }
    .nav-item:hover { background: #141414; color: #bbb; }
    .nav-item.active { color: #fff; background: #1a1a28; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .nav-item .icon {
      width: 34px; height: 34px; display: inline-flex;
      align-items: center; justify-content: center;
      border-radius: 12px; background: #12121d;
      flex-shrink: 0; transition: background 0.15s;
    }
    .nav-item .icon svg {
      width: 18px; height: 18px; display: block;
      stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .icon-home svg { stroke: #7F77DD; }
    .nav-item .icon-news svg { stroke: #D85A30; }
    .nav-item .icon-music svg { stroke: #1D9E75; }
    .nav-item .icon-gaming svg { stroke: #378ADD; }
    .nav-item .icon-messages svg { stroke: #7F77DD; }
    .nav-item .icon-friends svg { stroke: #D85A30; }
    .nav-item .icon-notifs svg { stroke: #BA7517; }
    .nav-item .icon-profile svg { stroke: #1D9E75; }
    .nav-item .icon-shop svg { stroke: #7F77DD; }
    .nav-item .icon-wallet svg { stroke: #378ADD; }
    .nav-item .icon-settings svg { stroke: #888780; }
    .nav-item .icon-admin svg { stroke: #e05c5c; }
    .nav-item .icon-logout svg { stroke: #7F77DD; }
    .nav-item.active .icon {
      background: linear-gradient(135deg, #171728, #302e56);
    }
    .nav-item.active .icon svg { stroke: #fff; }
    .nav-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 800; border-radius: 999px;
      padding: 2px 7px; min-width: 20px; text-align: center;
    }
    .nav-div { height: 1px; background: #181818; margin: 8px 12px; }
    .nav-spacer { flex: 1; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-top: 1px solid #181818; margin-top: 8px;
      text-decoration: none; border-radius: 12px; transition: background 0.15s;
    }
    .sidebar-user:hover { background: #141414; }
    .s-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .s-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-nav {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 14px; border-radius: 12px; font-size: 14px;
      color: var(--red); text-decoration: none; font-weight: 700;
      background: #1a080a; border: 1px solid #3a1015; transition: all 0.15s;
    }
    .admin-nav:hover { background: #220a0e; }
    .kw-dot { width: 7px; height: 7px; background: #7F77DD; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 8px #7F77DD; animation: kwPulse 2s infinite; display: inline-block; }
    @keyframes kwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    a[href="/wallet"]:hover { background: #0d0d1f !important; color: #a09fff !important; }
}
