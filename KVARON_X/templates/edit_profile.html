<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KRX — Редактировать профиль</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; display: flex; }
    .sidebar {
      width: 220px; min-height: 100vh; background: #0d0d0d;
      border-right: 1px solid #1e1e1e; padding: 20px 12px;
      display: flex; flex-direction: column; gap: 4px;
      position: fixed; top: 0; left: 0; height: 100vh;
    }
    .logo { font-size: 22px; font-weight: 700; padding: 8px 12px 20px; }
    .logo span { color: #444; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; font-size: 15px;
      color: #666; text-decoration: none; position: relative;
    }
    .nav-item:hover { background: #151515; color: #aaa; }
    .nav-item.active { color: #fff; background: #151515; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; background: #7F77DD; border-radius: 0 3px 3px 0;
    }
    .nav-badge { margin-left: auto; background: #e0245e; color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 6px; }
    .nav-div { height: 1px; background: #1e1e1e; margin: 4px 12px; }
    .nav-spacer { flex: 1; }
    .content {
      margin-left: 220px; flex: 1; display: flex;
      align-items: flex-start; justify-content: center;
      padding: 40px 20px; min-height: 100vh;
    }
    .card {
      background: #111; border: 1px solid #1e1e1e;
      border-radius: 16px; padding: 28px;
      width: 100%; max-width: 560px;
    }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: #555; margin-bottom: 24px; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
    input[type=text], input[type=date], textarea, select {
      width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 10px 14px; font-size: 14px;
      color: #eee; margin-bottom: 14px; outline: none;
      font-family: -apple-system, sans-serif;
    }
    input:focus, textarea:focus, select:focus { border-color: #7F77DD; }
    textarea { resize: none; min-height: 80px; }
    .char-count { font-size: 11px; color: #444; text-align: right; margin-top: -10px; margin-bottom: 14px; }
    .section-sep { height: 1px; background: #1e1e1e; margin: 16px 0; }
    .section-label { font-size: 13px; color: #7F77DD; font-weight: 600; margin-bottom: 12px; }

    .emoji-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .emoji-pick {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid #2a2a2a; background: #1a1a1a;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }
    .emoji-pick:hover { border-color: #555; }
    .emoji-pick.selected { border-color: #7F77DD; background: #1a1a2e; }

    .title-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .title-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 10px;
      border: 1px solid #2a2a2a; background: #1a1a1a;
      cursor: pointer; transition: all 0.15s;
    }
    .title-item:hover { border-color: #444; background: #1e1e1e; }
    .title-item.selected { border-color: #7F77DD; background: #0f0f1a; }
    .title-item.locked { opacity: 0.4; cursor: not-allowed; }
    .title-lvl { font-size: 11px; color: #555; min-width: 38px; }
    .title-lvl.earned { color: #7F77DD; }
    .title-name { font-size: 14px; color: #e0e0e0; font-weight: 600; flex: 1; }
    .title-desc { font-size: 12px; color: #444; }
    .title-lock { font-size: 13px; color: #333; }
    .title-check { font-size: 14px; color: #7F77DD; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid #1a1a1a;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 14px; color: #ccc; }
    .toggle-sub { font-size: 12px; color: #444; }

    .save-btn {
      width: 100%; background: #7F77DD; color: #fff; border: none;
      border-radius: 10px; padding: 12px; font-size: 15px;
      font-weight: 700; cursor: pointer; margin-top: 8px;
      transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.85; }
    .back-link {
      display: block; text-align: center; margin-top: 14px;
      font-size: 13px; color: #555; text-decoration: none;
    }
    .back-link:hover { color: #aaa; }
    .error { background: #1f0a0a; border: 1px solid #3a1010; color: #f08080; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
    .admin-status-box { background: #0f0f0f; border: 1px solid #e0245e33; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .admin-status-title { font-size: 13px; color: #e0245e; font-weight: 600; margin-bottom: 10px; }
