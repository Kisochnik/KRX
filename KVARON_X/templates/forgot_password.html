<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KVARON_X — Забыл пароль</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#111;border:1px solid #1e1e1e;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .logo{font-size:30px;font-weight:900;text-align:center;margin-bottom:4px;letter-spacing:-1px}
    .logo span{color:#333}
    .subtitle{text-align:center;color:#555;font-size:14px;margin-bottom:20px}
    input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px 16px;font-size:14px;color:#eee;margin-bottom:12px;outline:none;font-family:inherit;transition:border-color .15s}
    input:focus{border-color:#e0245e}
    input::placeholder{color:#444}
    .btn{width:100%;padding:13px;background:#e0245e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;font-family:inherit;transition:background .15s}
    .btn:hover{background:#c0103e}
    .login-link{text-align:center;margin-top:18px;font-size:13px;color:#555}
    .login-link a{color:#aaa;text-decoration:none}
    .login-link a:hover{color:#fff}
    .error{background:#1f0a0a;border:1px solid #3a1010;color:#f08080;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
    .success{background:#0a1f0a;border:1px solid #1a4a1a;color:#80f080;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;text-align:center}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">KVARON_X</div>
  <div class="subtitle">Восстановление доступа</div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if success %}<div class="success">{{ success }}</div>{% endif %}

  <form method="POST" action="/forgot-password">
    <input type="text" name="username_or_email" placeholder="Имя пользователя или Email" required>
    <button class="btn" type="submit">Отправить код</button>
  </form>

  <div class="login-link">
    <a href="/login">← Назад ко входу</a>
  </div>
</div>
</body>
</html>
