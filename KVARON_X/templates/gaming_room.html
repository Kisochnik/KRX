<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KRX — {{ group.name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 220px; background: #0d0d0d; border-right: 1px solid #1e1e1e; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; height: 100vh; overflow-y: auto; }
    .logo { font-size: 22px; font-weight: 800; padding: 6px 12px 16px; }
    .logo span { color: #555; }
    .nav-section-label { font-size: 10px; color: #333; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 8px 12px 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: #555; text-decoration: none; position: relative; transition: all 0.15s; font-weight: 500; }
    .nav-item:hover { background: #141414; color: #aaa; }
    .nav-item.active { color: #fff; background: #161622; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; background: #7F77DD; border-radius: 0 3px 3px 0; }
    .nav-badge { margin-left: auto; background: #e0245e; color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 6px; }
    .nav-div { height: 1px; background: #1a1a1a; margin: 6px 10px; }
    .nav-spacer { flex: 1; }
    .sidebar-user { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-top: 1px solid #1a1a1a; margin-top: 6px; text-decoration: none; border-radius: 10px; }
    .sidebar-av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .sidebar-av img { width: 100%; height: 100%; object-fit: cover; }
    .admin-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: #e0245e; text-decoration: none; font-weight: 600; background: #1a0808; border: 1px solid #3a1010; }
    .room-layout { display: flex; flex: 1; min-width: 0; height: 100vh; overflow: hidden; }
    .members-col { width: 220px; border-right: 1px solid #1e1e1e; display: flex; flex-direction: column; background: #0d0d0d; flex-shrink: 0; }
    .members-header { padding: 14px 16px; border-bottom: 1px solid #1e1e1e; font-size: 14px; font-weight: 700; }
    .members-list { flex: 1; overflow-y: auto; padding: 8px; }
    .member-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; text-decoration: none; transition: background 0.12s; }
    .member-item:hover { background: #111; }
    .m-av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; position: relative; }
    .m-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .online-dot { position: absolute; bottom: 1px; right: 1px; width: 9px; height: 9px; border-radius: 50%; background: #1D9E75; border: 2px solid #0d0d0d; }
    .offline-dot { position: absolute; bottom: 1px; right: 1px; width: 9px; height: 9px; border-radius: 50%; background: #2a2a2a; border: 2px solid #0d0d0d; }
    .m-name { font-size: 13px; color: #ccc; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-status { font-size: 11px; color: #444; }
    .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { padding: 12px 18px; border-bottom: 1px solid #1e1e1e; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .back-btn { color: #555; text-decoration: none; font-size: 14px; padding: 6px; border-radius: 8px; transition: color 0.15s; }
    .back-btn:hover { color: #aaa; }
    .group-icon-sm { width: 38px; height: 38px; border-radius: 10px; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .chat-group-name { font-size: 15px; font-weight: 700; }
    .chat-group-sub { font-size: 12px; color: #555; }
    .join-bar { padding: 12px 18px; background: #0c0c18; border-bottom: 1px solid #1e1e1e; display: flex; align-items: center; justify-content: space-between; }
    .join-bar span { font-size: 13px; color: #888; }
    .join-btn { background: #7F77DD; color: #fff; border: none; border-radius: 999px; padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .msgs-area { flex: 1; padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 2px; }
    .msg-row.mine { flex-direction: row-reverse; }
    .msg-av-wrap { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; }
    .msg-av-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .msg-av-placeholder { width: 28px; flex-shrink: 0; }
    .msg-content-wrap { display: flex; flex-direction: column; max-width: 60%; }
    .msg-row.mine .msg-content-wrap { align-items: flex-end; }
    .msg-sender { font-size: 11px; color: #555; margin-bottom: 2px; }
    .msg-bubble { padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg-bubble.mine { background: #7F77DD; color: #fff; border-bottom-right-radius: 4px; }
    .msg-bubble.theirs { background: #181818; color: #d0d0d0; border: 1px solid #222; border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: #333; margin-top: 3px; padding: 0 3px; }
    .chat-input-row { padding: 12px 16px; border-top: 1px solid #1a1a1a; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .chat-input { flex: 1; background: #141414; border: 1px solid #2a2a2a; border-radius: 999px; padding: 10px 16px; font-size: 14px; color: #eee; outline: none; font-family: inherit; }
    .chat-input:focus { border-color: #7F77DD; }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: #7F77DD; color: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .send-btn:hover { background: #6a63cc; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 999px; }
