<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KVARON_X — Войти</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 6px;
    }
    .logo span { color: #444; }
    .subtitle {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-bottom: 28px;
    }
    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: #eee;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #444; }
    input::placeholder { color: #444; }
    button {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #e0e0e0; }
    .register-link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #555;
    }
    .register-link a { color: #aaa; text-decoration: none; }
    .register-link a:hover { color: #fff; }
    .error {
      background: #1f0a0a;
      border: 1px solid #3a1010;
      color: #f08080;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .success {
      background: #0a1910;
      border: 1px solid #146433;
      color: #7bd08a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .lang-row{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
    .lang-btn{padding:5px 14px;border-radius:999px;border:1px solid #2a2a2a;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
    .lang-btn.active{background:#e0245e;color:#fff;border-color:#e0245e}
    .lang-btn:hover:not(.active){border-color:#555;color:#aaa}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">KVAR<span>ON_X</span></div>
    <div class="subtitle">KRX</div>
    <div class="subtitle">Добро пожаловать обратно</div>

    <div class="lang-row">
      <button class="lang-btn active" onclick="setLang('ru',this)" id="lang-ru">Рус</button>
      <button class="lang-btn" onclick="setLang('uk',this)" id="lang-uk">Укр</button>
      <button class="lang-btn" onclick="setLang('en',this)" id="lang-en">Eng</button>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="success">{{ success }}</div>
    {% endif %}

    {% if not require_2fa %}
    <form method="POST" action="/login">
      <input type="hidden" name="lang" value="{{ lang }}">
      <input type="text" name="username" placeholder="Имя пользователя" required>
      <input type="password" name="password" placeholder="Пароль" required>
      <button type="submit">Войти</button>
    </form>
    {% else %}
    <form method="POST" action="/login">
      <input type="hidden" name="lang" value="{{ lang }}">
      <input type="text" name="code" placeholder="Код из Telegram" required maxlength="6">
      <button type="submit">Подтвердить</button>
    </form>
    {% endif %}

    <div class="register-link">
      <a href="/forgot-password">Забыл пароль?</a>
    </div>
    <div class="register-link">
      Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
  </div>

  <script>
    function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Здесь можно добавить логику смены языка, но пока просто визуально
    }
  </script>
</body>
</html>
