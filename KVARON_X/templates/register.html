<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KVARON_X — Регистрация</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#111;border:1px solid #1e1e1e;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .logo{font-size:30px;font-weight:900;text-align:center;margin-bottom:4px;letter-spacing:-1px}
    .logo span{color:#333}
    .subtitle{text-align:center;color:#555;font-size:14px;margin-bottom:20px}
    .lang-row{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
    .lang-btn{padding:5px 14px;border-radius:999px;border:1px solid #2a2a2a;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
    .lang-btn.active{background:#e0245e;color:#fff;border-color:#e0245e}
    .lang-btn:hover:not(.active){border-color:#555;color:#aaa}
    input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px 16px;font-size:14px;color:#eee;margin-bottom:12px;outline:none;font-family:inherit;transition:border-color .15s}
    input:focus{border-color:#e0245e}
    input::placeholder{color:#444}
    .btn{width:100%;padding:13px;background:#e0245e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;font-family:inherit;transition:background .15s}
    .btn:hover{background:#c0103e}
    .login-link{text-align:center;margin-top:18px;font-size:13px;color:#555}
    .login-link a{color:#aaa;text-decoration:none}
    .login-link a:hover{color:#fff}
    .error{background:#1f0a0a;border:1px solid #3a1010;color:#f08080;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
    .success{background:#0a1f0a;border:1px solid #1a4a1a;color:#80f080;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;text-align:center}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">KVARON_X</div>
  <div class="subtitle" id="subtitle">KRX</div>

  <div class="lang-row">
    <button class="lang-btn active" onclick="setLang('ru',this)" id="lang-ru">Рус</button>
    <button class="lang-btn" onclick="setLang('uk',this)" id="lang-uk">Укр</button>
    <button class="lang-btn" onclick="setLang('en',this)" id="lang-en">Eng</button>
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if success %}<div class="success">{{ success }}</div>{% endif %}

  <form method="POST" action="/register" id="reg-form">
    <input type="hidden" name="lang" id="lang-input" value="{{ lang or 'ru' }}">
    <input type="text" name="username" id="f-user" placeholder="Имя пользователя" required autocomplete="off">
    <input type="email" name="email" id="f-email" placeholder="Email" required>
    <input type="password" name="password" id="f-pass" placeholder="Пароль" required>
    <input type="date" name="birthday" id="f-bday">
    <button class="btn" type="submit" id="f-submit">Зарегистрироваться</button>
  </form>

  <div class="login-link">
    <span id="already-text">Уже есть аккаунт?</span> <a href="/login" id="login-link-a">Войти</a>
  </div>
</div>

<script>
const T = {
  ru:{sub:'KRX',u:'Имя пользователя',e:'Email',p:'Пароль',b:'Дата рождения',s:'Зарегистрироваться',a:'Уже есть аккаунт?',l:'Войти'},
  uk:{sub:'KRX',u:"Ім'я користувача",e:'Email',p:'Пароль',b:'Дата народження',s:'Зареєструватися',a:'Вже є акаунт?',l:'Увійти'},
  en:{sub:"KRX",u:'Username',e:'Email',p:'Password',b:'Birthday',s:'Sign Up',a:'Already have an account?',l:'Log In'}
};
function setLang(lang,btn){
  const t=T[lang];
  document.getElementById('subtitle').textContent=t.sub;
  document.getElementById('f-user').placeholder=t.u;
  document.getElementById('f-email').placeholder=t.e;
  document.getElementById('f-pass').placeholder=t.p;
  document.getElementById('f-bday').placeholder=t.b;
  document.getElementById('f-submit').textContent=t.s;
  document.getElementById('already-text').textContent=t.a;
  document.getElementById('login-link-a').textContent=t.l;
  document.getElementById('lang-input').value=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  localStorage.setItem('KVARON_X_lang',lang);
}
window.addEventListener('DOMContentLoaded',()=>{
  const s=localStorage.getItem('KVARON_X_lang');
  if(s&&s!=='ru'){const b=document.getElementById('lang-'+s);if(b)setLang(s,b);}
});
</script>
</body>
</html>
